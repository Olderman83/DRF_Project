name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file for tests
        run: |
          cat > .env << EOF
          SECRET_KEY=django-insecure-test-key-12345678
          DEBUG=True
          ALLOWED_HOSTS=localhost,127.0.0.1
          DATABASE_NAME=test_db
          DATABASE_USER=test_user
          DATABASE_PASSWORD=test_password
          DATABASE_HOST=localhost
          DATABASE_PORT=5432
          REDIS_HOST=localhost
          REDIS_PORT=6379
          REDIS_DB=0
          REDIS_URL=redis://localhost:6379/0
          CELERY_BROKER_URL=redis://localhost:6379/0
          CELERY_RESULT_BACKEND=redis://localhost:6379/0
          STRIPE_SECRET_KEY=sk_test_dummy
          STRIPE_PUBLIC_KEY=pk_test_dummy
          SITE_URL=http://localhost:8000
          EOF

      - name: Run migrations
        run: |
          python manage.py makemigrations
          python manage.py migrate

      - name: Run tests with coverage
        run: |
          pip install coverage
          coverage run manage.py test
          coverage report -m --fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'DEPLOY_SCRIPT'
            set -e
            echo "Starting deployment..."
            
            cd ${{ secrets.SERVER_PATH }}
            
            echo "Pulling latest changes..."
            git pull origin ${{ github.ref_name }}
            
            echo "Updating .env file..."
            # .env файл уже существует на сервере, не перезаписываем
            
            echo "Stopping containers..."
            docker-compose down
            
            echo "Rebuilding containers..."
            docker-compose build --no-cache
            
            echo "Starting containers..."
            docker-compose up -d
            
            echo "Running migrations..."
            docker-compose exec -T web python manage.py migrate
            
            echo "Loading fixtures..."
            docker-compose exec -T web python manage.py loaddata users/fixtures/groups.json 2>/dev/null || true
            docker-compose exec -T web python manage.py loaddata fixtures/users.json 2>/dev/null || true
            docker-compose exec -T web python manage.py loaddata fixtures/courses_lessons.json 2>/dev/null || true
            docker-compose exec -T web python manage.py loaddata fixtures/payments.json 2>/dev/null || true
            
            echo "Collecting static files..."
            docker-compose exec -T web python manage.py collectstatic --noinput
            
            echo "Restarting services..."
            docker-compose restart web celery celery-beat
            
            echo "Deployment completed successfully!"
            
            echo "Container status:"
            docker-compose ps
          DEPLOY_SCRIPT

      - name: Health check
        run: |
          echo "Performing health check..."
          sleep 30
          curl -f http://${{ secrets.SSH_HOST }}:8000/api/token/ || echo "Health check warning"

  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "Deployment successful!"
          else
            echo "Deployment failed!"
            exit 1
